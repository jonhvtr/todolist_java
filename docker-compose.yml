services:
  dcs-postgres:
    image: postgres:15
    container_name: dcs-postgres
    restart: always
    env_file:
      - .env
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  dcs-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dcs-pgadmin
    restart: always
    depends_on:
      - dcs-postgres
    env_file:
      - .env
    ports:
      - "8081:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

networks:
  default:
    name: local-network
    external: true

volumes:
    pg-data:
    pgadmin-data: